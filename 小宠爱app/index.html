<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-secondary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .content { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 40px; background: var(--bg-secondary); }

        .logo-container { margin-bottom: 50px; text-align: center; }
        .logo-icon { width: 100px; height: 100px; background: var(--bg-primary); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: var(--shadow-layer); }
        .logo-icon i { font-size: 48px; color: var(--text-secondary); }

        .app-name { font-size: 28px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; letter-spacing: 1px; }
        .app-slogan { font-size: 13px; color: var(--text-tertiary); letter-spacing: 0.5px; }

        .features { display: flex; gap: 20px; margin-bottom: 50px; }
        .feature-item { text-align: center; }
        .feature-icon { width: 52px; height: 52px; background: var(--bg-primary); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; box-shadow: var(--shadow-soft); }
        .feature-icon i { font-size: 18px; color: var(--text-secondary); }
        .feature-item span { font-size: 11px; color: var(--text-tertiary); }

        .start-btn { width: 100%; max-width: 260px; padding: 14px 32px; background: var(--text-primary); color: #fff; border: none; border-radius: 26px; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-medium); transition: all 0.25s ease; }
        .start-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-layer); }
        .start-btn:active { transform: translateY(0); }

        .bottom-text { margin-top: 20px; font-size: 11px; color: var(--text-tertiary); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.6s ease-out forwards; }
        .delay-1 { animation-delay: 0.15s; opacity: 0; }
        .delay-2 { animation-delay: 0.3s; opacity: 0; }
        .delay-3 { animation-delay: 0.45s; opacity: 0; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="content">
            <div class="logo-container animate-fadeIn">
                <div class="logo-icon">
                    <i class="fas fa-paw"></i>
                </div>
                <h1 class="app-name">小宠爱</h1>
                <p class="app-slogan">宠物健康生活管家</p>
            </div>

            <div class="features animate-fadeIn delay-1">
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-folder-open"></i>
                    </div>
                    <span>宠物档案</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <span>日常记录</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <span>健康管理</span>
                </div>
            </div>

            <button class="start-btn animate-fadeIn delay-2" onclick="startApp()">
                开启旅程
            </button>

            <p class="bottom-text animate-fadeIn delay-3">记录宠物每一天的成长与健康</p>
        </div>
    </div>

    <script>
        function startApp() {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
