<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添加饮食记录 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=PingFang+SC:wght@400;500;600;700&display=swap');
        * { font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }

        .content { height: calc(100% - 44px - 52px - 80px); overflow-y: auto; background: var(--bg-primary); padding: 16px; }
        .content::-webkit-scrollbar { display: none; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 8px; }
        .input-field { width: 100%; padding: 12px 14px; border: 1px solid var(--border-light); border-radius: 12px; font-size: 14px; outline: none; background: var(--bg-secondary); color: var(--text-primary); }
        .input-field:focus { border-color: var(--text-tertiary); }

        .food-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .food-type-item { padding: 14px 10px; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .food-type-item.selected { border-color: var(--text-primary); background: var(--bg-tertiary); }

        .btn-primary { background: var(--text-primary); color: #fff; border: none; border-radius: 24px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.25s ease; }
        .btn-primary:hover { opacity: 0.9; }

        .bottom-bar { padding: 16px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border-light); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">添加饮食记录</div>
        </div>

        <div class="content">
            <div class="form-group animate-fadeIn">
                <label class="form-label">选择宠物</label>
                <div class="flex gap-3">
                    <div class="flex-1 p-3 rounded-xl flex items-center gap-2" style="background: var(--bg-secondary); border: 1px solid var(--text-primary);">
                        <img src="https://images.unsplash.com/photo-1633722715463-d30f4f325e24?w=50&h=50&fit=crop" class="w-8 h-8 rounded-full object-cover">
                        <span class="text-sm font-medium" style="color: var(--text-primary);">豆豆</span>
                    </div>
                </div>
            </div>

            <div class="form-group animate-fadeIn delay-1">
                <label class="form-label">餐次</label>
                <div class="flex gap-3">
                    <div class="flex-1 p-3 rounded-xl text-center" style="background: var(--bg-secondary); border: 1px solid var(--text-primary); color: var(--text-primary); font-weight: 500;">早餐</div>
                    <div class="flex-1 p-3 rounded-xl text-center" style="background: var(--bg-tertiary); border: 1px solid transparent; color: var(--text-tertiary);">午餐</div>
                    <div class="flex-1 p-3 rounded-xl text-center" style="background: var(--bg-tertiary); border: 1px solid transparent; color: var(--text-tertiary);">晚餐</div>
                </div>
            </div>

            <div class="form-group animate-fadeIn delay-1">
                <label class="form-label">食物类型</label>
                <div class="food-type-grid">
                    <div class="food-type-item" onclick="selectFood(this)">
                        <i class="fas fa-bone text-xl mb-2" style="color: var(--text-secondary);"></i>
                        <div class="text-sm font-medium" style="color: var(--text-primary);">狗粮</div>
                    </div>
                    <div class="food-type-item" onclick="selectFood(this)">
                        <i class="fas fa-drumstick-bite text-xl mb-2" style="color: var(--text-secondary);"></i>
                        <div class="text-sm font-medium" style="color: var(--text-primary);">肉类</div>
                    </div>
                    <div class="food-type-item selected" onclick="selectFood(this)">
                        <i class="fas fa-fish text-xl mb-2" style="color: var(--text-secondary);"></i>
                        <div class="text-sm font-medium" style="color: var(--text-primary);">鱼类</div>
                    </div>
                    <div class="food-type-item" onclick="selectFood(this)">
                        <i class="fas fa-carrot text-xl mb-2" style="color: var(--text-secondary);"></i>
                        <div class="text-sm font-medium" style="color: var(--text-primary);">蔬菜</div>
                    </div>
                    <div class="food-type-item" onclick="selectFood(this)">
                        <i class="fas fa-apple-alt text-xl mb-2" style="color: var(--text-secondary);"></i>
                        <div class="text-sm font-medium" style="color: var(--text-primary);">水果</div>
                    </div>
                    <div class="food-type-item" onclick="selectFood(this)">
                        <i class="fas fa-cookie text-xl mb-2" style="color: var(--text-secondary);"></i>
                        <div class="text-sm font-medium" style="color: var(--text-primary);">零食</div>
                    </div>
                </div>
            </div>

            <div class="form-group animate-fadeIn delay-2">
                <label class="form-label">食物名称</label>
                <input type="text" class="input-field" placeholder="如：三文鱼鸡胸肉">
            </div>

            <div class="form-group animate-fadeIn delay-2">
                <label class="form-label">用量 (g)</label>
                <input type="number" class="input-field" placeholder="请输入用量" value="150">
            </div>

            <div class="form-group animate-fadeIn delay-2">
                <label class="form-label">时间</label>
                <input type="time" class="input-field" value="08:30">
            </div>

            <div class="form-group animate-fadeIn delay-3">
                <label class="form-label">备注</label>
                <input type="text" class="input-field" placeholder="可选备注">
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn-primary" onclick="saveRecord()">保存</button>
        </div>
    </div>

    <script>
        function goBack() { window.history.back(); }
        function saveRecord() { window.location.href = 'diet-records.html'; }

        function selectFood(el) {
            document.querySelectorAll('.food-type-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
        }
    </script>
</body>
</html>
