<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添加健康记录 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }

        .content { height: calc(100% - 44px - 52px - 80px); overflow-y: auto; background: var(--bg-primary); padding: 16px; }
        .content::-webkit-scrollbar { display: none; }

        .form-card { background: var(--bg-secondary); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); }

        .form-group { margin-bottom: 16px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
        .input-field { width: 100%; padding: 14px 16px; border: 1px solid var(--border-light); border-radius: 12px; font-size: 14px; outline: none; background: var(--bg-secondary); color: var(--text-primary); transition: all 0.25s ease; }
        .input-field:focus { border-color: var(--text-tertiary); box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }

        .status-options { display: flex; gap: 10px; }
        .status-option { flex: 1; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.25s ease; font-size: 13px; color: var(--text-primary); }
        .status-option.selected { border-color: var(--text-primary); background: var(--bg-tertiary); }

        .btn-primary { background: var(--text-primary); color: #fff; border: none; border-radius: 24px; padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; box-shadow: var(--shadow-medium); width: 100%; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-layer); }

        .bottom-bar { padding: 16px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border-light); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">添加健康记录</div>
        </div>

        <div class="content">
            <div class="form-card animate-fadeIn">
                <div class="form-group">
                    <label class="form-label">体重 (kg)</label>
                    <input type="number" class="input-field" placeholder="请输入体重" value="18.5">
                </div>

                <div class="form-group">
                    <label class="form-label">精神状态</label>
                    <div class="status-options">
                        <div class="status-option selected" onclick="selectStatus(this)">良好</div>
                        <div class="status-option" onclick="selectStatus(this)">一般</div>
                        <div class="status-option" onclick="selectStatus(this)">萎靡</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">食欲状态</label>
                    <div class="status-options">
                        <div class="status-option selected" onclick="selectStatus(this)">食欲良好</div>
                        <div class="status-option" onclick="selectStatus(this)">食欲一般</div>
                        <div class="status-option" onclick="selectStatus(this)">食欲不振</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">排便情况</label>
                    <div class="status-options">
                        <div class="status-option selected" onclick="selectStatus(this)">正常</div>
                        <div class="status-option" onclick="selectStatus(this)">稀软</div>
                        <div class="status-option" onclick="selectStatus(this)">异常</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">异常症状</label>
                    <input type="text" class="input-field" placeholder="请描述异常症状，如无异常请填写"无"" value="无">
                </div>

                <div class="form-group">
                    <label class="form-label">备注</label>
                    <input type="text" class="input-field" placeholder="可选备注">
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn-primary" onclick="saveRecord()">保存</button>
        </div>
    </div>

    <script>
        function goBack() { window.history.back(); }
        function saveRecord() { window.location.href = 'health-records.html'; }

        function selectStatus(el) {
            el.parentElement.querySelectorAll('.status-option').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
        }
    </script>
</body>
</html>
