<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>体检报告 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=PingFang+SC:wght@400;500;600;700&display=swap');
        * { font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }

        .content { height: calc(100% - 44px - 52px - 80px); overflow-y: auto; background: var(--bg-primary); padding: 16px; }
        .content::-webkit-scrollbar { display: none; }

        .record-item { background: var(--bg-secondary); border-radius: 14px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; transition: all 0.25s ease; cursor: pointer; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); }
        .record-item:hover { box-shadow: var(--shadow-medium); transform: translateY(-1px); }

        .fab { width: 52px; height: 52px; background: var(--text-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-medium); cursor: pointer; transition: all 0.25s ease; position: absolute; bottom: 90px; right: 20px; }
        .fab:hover { transform: scale(1.05); }
        .fab:active { transform: scale(0.95); }
        .fab i { color: #fff; font-size: 18px; }

        .bottom-bar { padding: 16px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border-light); }

        .section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">体检报告</div>
        </div>

        <div class="content">
            <div class="rounded-2xl p-4 mb-4 animate-fadeIn" style="background: var(--bg-secondary); box-shadow: var(--shadow-soft); border: 1px solid var(--border-light);">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 bg-[var(--bg-tertiary)] rounded-full flex items-center justify-center">
                        <i class="fas fa-heartbeat text-3xl" style="color: var(--text-secondary);"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm mb-1" style="color: var(--text-tertiary);">当前体重</div>
                        <div id="currentWeight" class="text-3xl font-bold" style="color: var(--text-primary);">-- <span class="text-lg font-normal">kg</span></div>
                    </div>
                </div>
            </div>

            <div class="space-y-2 animate-fadeIn delay-1">
                <div class="record-item" id="weightRecord">
                    <div class="w-12 h-12 bg-[var(--bg-tertiary)] rounded-xl flex items-center justify-center">
                        <i class="fas fa-weight" style="color: var(--text-secondary); font-size: 18px;"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-sm mb-1" style="color: var(--text-primary);">体重记录</div>
                        <div id="weightValue" class="text-sm" style="color: var(--text-tertiary);">--kg</div>
                    </div>
                    <div class="text-right">
                        <div id="weightDate" class="text-sm" style="color: var(--text-tertiary);">----/--/--</div>
                    </div>
                </div>

                <div class="record-item" id="spiritRecord">
                    <div class="w-12 h-12 bg-[var(--bg-tertiary)] rounded-xl flex items-center justify-center">
                        <i class="fas fa-smile" style="color: var(--text-secondary); font-size: 18px;"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-sm mb-1" style="color: var(--text-primary);">精神状态</div>
                        <div id="spiritValue" class="text-sm" style="color: var(--text-tertiary);">良好</div>
                    </div>
                    <div class="text-right">
                        <div id="spiritDate" class="text-sm" style="color: var(--text-tertiary);">----/--/--</div>
                    </div>
                </div>

                <div class="record-item" id="appetiteRecord">
                    <div class="w-12 h-12 bg-[var(--bg-tertiary)] rounded-xl flex items-center justify-center">
                        <i class="fas fa-utensils" style="color: var(--text-secondary); font-size: 18px;"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-sm mb-1" style="color: var(--text-primary);">食欲状态</div>
                        <div id="appetiteValue" class="text-sm" style="color: var(--text-tertiary);">食欲良好</div>
                    </div>
                    <div class="text-right">
                        <div id="appetiteDate" class="text-sm" style="color: var(--text-tertiary);">----/--/--</div>
                    </div>
                </div>

                <div class="record-item" id="abnormalityRecord">
                    <div class="w-12 h-12 bg-[var(--bg-tertiary)] rounded-xl flex items-center justify-center">
                        <i class="fas fa-notes-medical" style="color: var(--text-secondary); font-size: 18px;"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-sm mb-1" style="color: var(--text-primary);">异常症状</div>
                        <div id="abnormalityValue" class="text-sm" style="color: var(--text-tertiary);">无异常</div>
                    </div>
                    <div class="text-right">
                        <div id="abnormalityDate" class="text-sm" style="color: var(--text-tertiary);">----/--/--</div>
                    </div>
                </div>
            </div>

            <div class="section-title mt-4">历史记录</div>
            <div id="historyRecords" class="space-y-2"></div>
        </div>

        <div class="fab" onclick="goToAdd()">
            <i class="fas fa-plus"></i>
        </div>

        <div class="bottom-bar">
            <div class="text-center text-xs" style="color: var(--text-tertiary);">共 28 条记录</div>
        </div>
    </div>

    <script>
        const petHealthRecords = {
            doudou: [
                { id: 1, date: '2026-04-15', weight: '28.0kg', temperature: '38.5°C', abnormality: '无异常', hospital: '宠物医院', doctor: '王医生' },
                { id: 2, date: '2025-10-15', weight: '27.5kg', temperature: '38.4°C', abnormality: '无异常', hospital: '宠物医院', doctor: '王医生' },
                { id: 3, date: '2025-04-15', weight: '27.0kg', temperature: '38.3°C', abnormality: '无异常', hospital: '宠物医院', doctor: '王医生' }
            ],
            tuanzi: [
                { id: 1, date: '2026-04-10', weight: '5.5kg', temperature: '38.7°C', abnormality: '无异常', hospital: '宠物医院', doctor: '李医生' },
                { id: 2, date: '2025-10-10', weight: '5.3kg', temperature: '38.6°C', abnormality: '无异常', hospital: '宠物医院', doctor: '李医生' },
                { id: 3, date: '2025-04-10', weight: '5.1kg', temperature: '38.7°C', abnormality: '无异常', hospital: '宠物医院', doctor: '李医生' }
            ],
            xiaomi: [
                { id: 1, date: '2026-04-01', weight: '4.5kg', temperature: '38.8°C', abnormality: '无异常', hospital: '宠物医院', doctor: '张医生' },
                { id: 2, date: '2025-10-01', weight: '4.3kg', temperature: '38.7°C', abnormality: '无异常', hospital: '宠物医院', doctor: '张医生' },
                { id: 3, date: '2025-04-01', weight: '4.1kg', temperature: '38.6°C', abnormality: '无异常', hospital: '宠物医院', doctor: '张医生' }
            ]
        };

        let currentPet = localStorage.getItem('currentPet') || 'tuanzi';

        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return params.get('pet') || localStorage.getItem('currentPet') || 'tuanzi';
        }

        function initPage() {
            currentPet = getURLParams();
            displayHealthRecords();
        }

        function displayHealthRecords() {
            const records = petHealthRecords[currentPet] || [];

            if (records.length > 0) {
                const latestRecord = records[0];
                document.getElementById('currentWeight').innerHTML = latestRecord.weight.split('kg')[0] + ' <span class="text-lg font-normal">kg</span>';
                document.getElementById('weightValue').textContent = latestRecord.weight;
                document.getElementById('weightDate').textContent = latestRecord.date;
                document.getElementById('spiritDate').textContent = latestRecord.date;
                document.getElementById('appetiteDate').textContent = latestRecord.date;
                document.getElementById('abnormalityDate').textContent = latestRecord.date;
            }

            const recordsContainer = document.getElementById('historyRecords');

            if (recordsContainer) {
                recordsContainer.innerHTML = '';

                records.forEach((record, index) => {
                    const recordItem = document.createElement('div');
                    recordItem.className = 'record-item animate-fadeIn delay-' + (index + 1);

                    recordItem.innerHTML = `
                        <div class="w-12 h-12 bg-[var(--bg-tertiary)] rounded-xl flex items-center justify-center">
                            <i class="fas fa-stethoscope" style="color: var(--text-secondary); font-size: 18px;"></i>
                        </div>
                        <div class="flex-1">
                            <div class="font-medium text-sm mb-1" style="color: var(--text-primary);">体检日期: ${record.date}</div>
                            <div class="text-sm" style="color: var(--text-tertiary);">体重: ${record.weight} · 体温: ${record.temperature}</div>
                            <div class="text-sm" style="color: var(--text-tertiary);">异常情况: ${record.abnormality}</div>
                            <div class="text-sm" style="color: var(--text-tertiary);">医院: ${record.hospital} · 医生: ${record.doctor}</div>
                        </div>
                    `;

                    recordsContainer.appendChild(recordItem);
                });
            }
        }

        window.onload = initPage;

        function goBack() { window.history.back(); }
        function goToAdd() { window.location.href = 'health-record-add.html?pet=' + currentPet; }
    </script>
</body>
</html>
