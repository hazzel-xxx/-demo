<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物相册 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=PingFang+SC:wght@400;500;600;700&display=swap');
        * { font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }

        .content { height: calc(100% - 44px - 52px - 72px); overflow-y: auto; background: var(--bg-primary); }
        .content::-webkit-scrollbar { display: none; }

        .filter-bar { display: flex; gap: 8px; padding: 16px; }
        .filter-chip { padding: 8px 16px; background: var(--bg-secondary); border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; border: 1px solid var(--border-light); color: var(--text-tertiary); }
        .filter-chip.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }

        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 16px 16px; }
        .photo-item { aspect-ratio: 1; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; background: var(--bg-tertiary); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.25s ease; }
        .photo-item:hover img { transform: scale(1.05); }

        .photo-item .delete-btn { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
        .photo-item:hover .delete-btn { opacity: 1; }

        .bottom-bar { height: 72px; padding: 16px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; position: absolute; bottom: 0; left: 0; right: 0; }

        .fab { width: 52px; height: 52px; background: var(--text-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-medium); cursor: pointer; transition: all 0.25s ease; position: absolute; bottom: 90px; right: 20px; }
        .fab:hover { transform: scale(1.05); }
        .fab:active { transform: scale(0.95); }
        .fab i { color: #fff; font-size: 18px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">宠物相册</div>
        </div>

        <div class="content">
            <div class="filter-bar animate-fadeIn">
                <div class="filter-chip active">全部</div>
                <div class="filter-chip">2024年</div>
                <div class="filter-chip">2023年</div>
                <div class="filter-chip">饮食</div>
                <div class="filter-chip">运动</div>
                <div class="filter-chip">美容</div>
            </div>

            <div class="photo-grid">
                <div class="photo-item animate-fadeIn delay-1" onclick="viewPhoto(0)">
                    <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=200&h=200&fit=crop" alt="豆豆">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-1" onclick="viewPhoto(1)">
                    <img src="https://images.unsplash.com/photo-1561037404-61cd46aa615b?w=200&h=200&fit=crop" alt="豆豆">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-1" onclick="viewPhoto(2)">
                    <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=200&h=200&fit=crop" alt="团子">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-2" onclick="viewPhoto(3)">
                    <img src="https://images.unsplash.com/photo-1548247416-ec66f4900b2e?w=200&h=200&fit=crop" alt="小咪">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-2" onclick="viewPhoto(4)">
                    <img src="https://images.unsplash.com/photo-1548247416-ec66f4900b2e?w=200&h=200&fit=crop" alt="小咪">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-2" onclick="viewPhoto(5)">
                    <img src="https://images.unsplash.com/photo-1548247416-ec66f4900b2e?w=200&h=200&fit=crop" alt="小咪">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-3" onclick="viewPhoto(6)">
                    <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=200&h=200&fit=crop" alt="豆豆">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-3" onclick="viewPhoto(7)">
                    <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=200&h=200&fit=crop" alt="团子">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
                <div class="photo-item animate-fadeIn delay-3" onclick="viewPhoto(8)">
                    <img src="https://images.unsplash.com/photo-1548247416-ec66f4900b2e?w=200&h=200&fit=crop" alt="小咪">
                    <div class="delete-btn" onclick="deletePhoto(event)">
                        <i class="fas fa-times text-white text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="fab" onclick="uploadPhoto()">
                <i class="fas fa-plus"></i>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="text-sm" style="color: var(--text-tertiary);">共 28 张照片</div>
            <button class="px-4 py-2 rounded-full text-sm font-medium cursor-pointer" style="background: var(--bg-tertiary); color: var(--text-primary);" onclick="selectAll()">
                <i class="fas fa-check-square mr-1"></i>管理
            </button>
        </div>
    </div>

    <script>
        function goBack() { window.history.back(); }

        function viewPhoto(index) {
            alert('查看照片 ' + (index + 1));
        }

        function deletePhoto(event) {
            event.stopPropagation();
            if (confirm('确定要删除这张照片吗？')) {
                alert('照片已删除');
            }
        }

        function uploadPhoto() {
            alert('上传照片');
        }

        function selectAll() {
            alert('管理照片');
        }
    </script>
</body>
</html>
