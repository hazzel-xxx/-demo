<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>驱虫记录 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }

        .content { height: calc(100% - 44px - 52px - 72px); overflow-y: auto; background: var(--bg-primary); padding: 16px; }
        .content::-webkit-scrollbar { display: none; }

        .tab-bar { height: 72px; background: var(--bg-secondary); border-top: 1px solid var(--border-light); display: flex; position: absolute; bottom: 0; left: 0; right: 0; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-tertiary); font-size: 10px; cursor: pointer; transition: all 0.2s ease; }
        .tab-item.active { color: var(--text-primary); }
        .tab-item i { font-size: 20px; }

        .tabs { display: flex; background: var(--bg-secondary); border-radius: 12px; padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; cursor: pointer; transition: all 0.3s ease; border-radius: 8px; color: var(--text-tertiary); font-weight: 500; }
        .tab.active { background: var(--text-primary); color: #fff; }

        .records-card { background: var(--bg-secondary); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); }

        .record-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border-light); transition: all 0.2s ease; cursor: pointer; }
        .record-item:last-child { border-bottom: none; }
        .record-item:hover { background: var(--bg-tertiary); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }

        .record-icon { width: 44px; height: 44px; background: var(--bg-tertiary); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .record-icon i { color: var(--text-secondary); font-size: 18px; }

        .record-info { flex: 1; }
        .record-date { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
        .record-details { font-size: 12px; color: var(--text-tertiary); margin-bottom: 2px; }

        .record-status { padding: 4px 10px; background: var(--bg-tertiary); border-radius: 10px; font-size: 11px; font-weight: 500; color: var(--text-secondary); }

        .fab { width: 52px; height: 52px; background: var(--text-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-medium); cursor: pointer; transition: all 0.25s ease; position: absolute; bottom: 90px; right: 20px; }
        .fab:hover { transform: scale(1.05); }
        .fab:active { transform: scale(0.95); }
        .fab i { color: #fff; font-size: 18px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">驱虫记录</div>
        </div>

        <div class="content">
            <div class="tabs animate-fadeIn">
                <div class="tab active" onclick="switchTab('internal')">体内驱虫</div>
                <div class="tab" onclick="switchTab('external')">体外驱虫</div>
            </div>
            <div class="records-card animate-fadeIn delay-1">
                <div id="internalRecords"></div>
                <div id="externalRecords" class="hidden"></div>
            </div>
        </div>

        <div class="fab" onclick="goToAdd()">
            <i class="fas fa-plus"></i>
        </div>

        <div class="tab-bar">
            <div class="tab-item" onclick="goToHome()">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="tab-item" onclick="goToProfiles()">
                <i class="fas fa-folder-open"></i>
                <span>档案</span>
            </div>
            <div class="tab-item" onclick="goToRecords()">
                <i class="fas fa-clipboard-list"></i>
                <span>日记</span>
            </div>
            <div class="tab-item" onclick="goToHealth()">
                <i class="fas fa-heartbeat"></i>
                <span>健康</span>
            </div>
            <div class="tab-item" onclick="goToMy()">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>

    <script>
        const petDewormingData = {
            doudou: {
                internal: [
                    { date: '2026-04-15', product: '犬心保', dosage: '1片', nextDate: '2026-05-15', notes: '正常' },
                    { date: '2026-03-15', product: '犬心保', dosage: '1片', nextDate: '2026-04-15', notes: '正常' },
                    { date: '2026-02-15', product: '犬心保', dosage: '1片', nextDate: '2026-03-15', notes: '正常' }
                ],
                external: [
                    { date: '2026-04-01', product: '福来恩', dosage: '1支', nextDate: '2026-05-01', notes: '正常' },
                    { date: '2026-03-01', product: '福来恩', dosage: '1支', nextDate: '2026-04-01', notes: '正常' },
                    { date: '2026-02-01', product: '福来恩', dosage: '1支', nextDate: '2026-03-01', notes: '正常' }
                ]
            },
            tuanzi: {
                internal: [
                    { date: '2026-04-10', product: '拜宠清', dosage: '1片', nextDate: '2026-07-10', notes: '正常' },
                    { date: '2026-01-10', product: '拜宠清', dosage: '1片', nextDate: '2026-04-10', notes: '正常' },
                    { date: '2025-10-10', product: '拜宠清', dosage: '1片', nextDate: '2026-01-10', notes: '正常' }
                ],
                external: [
                    { date: '2026-04-05', product: '大宠爱', dosage: '1支', nextDate: '2026-05-05', notes: '正常' },
                    { date: '2026-03-05', product: '大宠爱', dosage: '1支', nextDate: '2026-04-05', notes: '正常' },
                    { date: '2026-02-05', product: '大宠爱', dosage: '1支', nextDate: '2026-03-05', notes: '正常' }
                ]
            },
            xiaomi: {
                internal: [
                    { date: '2026-04-01', product: '猫拜宠清', dosage: '1片', nextDate: '2026-07-01', notes: '正常' },
                    { date: '2026-01-01', product: '猫拜宠清', dosage: '1片', nextDate: '2026-04-01', notes: '正常' },
                    { date: '2025-10-01', product: '猫拜宠清', dosage: '1片', nextDate: '2026-01-01', notes: '正常' }
                ],
                external: [
                    { date: '2026-04-15', product: '爱沃克', dosage: '1支', nextDate: '2026-05-15', notes: '正常' },
                    { date: '2026-03-15', product: '爱沃克', dosage: '1支', nextDate: '2026-04-15', notes: '正常' },
                    { date: '2026-02-15', product: '爱沃克', dosage: '1支', nextDate: '2026-03-15', notes: '正常' }
                ]
            }
        };

        let currentPet = 'tuanzi';
        let currentTab = 'internal';

        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return params.get('pet') || 'tuanzi';
        }

        function initPage() {
            currentPet = getURLParams();
            displayDewormingRecords();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById('internalRecords').classList.add('hidden');
            document.getElementById('externalRecords').classList.add('hidden');
            document.getElementById(`${tab}Records`).classList.remove('hidden');
            displayDewormingRecords();
        }

        function displayDewormingRecords() {
            const records = petDewormingData[currentPet]?.[currentTab] || [];
            const recordsContainer = document.getElementById(`${currentTab}Records`);

            if (recordsContainer) {
                recordsContainer.innerHTML = '';

                records.forEach((record, index) => {
                    const recordItem = document.createElement('div');
                    recordItem.className = 'record-item animate-fadeIn delay-' + (index + 1);

                    recordItem.innerHTML = `
                        <div class="record-icon">
                            <i class="fas fa-pills"></i>
                        </div>
                        <div class="record-info">
                            <div class="record-date">${record.date}</div>
                            <div class="record-details">${record.product} · ${record.dosage}</div>
                            <div class="record-details">下次驱虫: ${record.nextDate}</div>
                        </div>
                        <div class="record-status">已完成</div>
                    `;

                    recordsContainer.appendChild(recordItem);
                });
            }
        }

        window.onload = initPage;

        function goBack() { window.history.back(); }
        function goToHome() { window.location.href = '../../home.html?pet=' + currentPet; }
        function goToProfiles() { window.location.href = '../profile/profile-list.html'; }
        function goToRecords() { window.location.href = '../records/records-home.html?pet=' + currentPet; }
        function goToHealth() { window.location.href = '../health/health-reminders.html?pet=' + currentPet; }
        function goToMy() { window.location.href = '../my/my-home.html'; }
        function goToAdd() { alert('添加驱虫记录'); }
    </script>
</body>
</html>
