<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健康趋势 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=PingFang+SC:wght@400;500;600;700&display=swap');
        * { font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }

        .content { height: calc(100% - 44px - 52px); overflow-y: auto; background: var(--bg-primary); }
        .content::-webkit-scrollbar { display: none; }

        .filter-bar { display: flex; gap: 8px; padding: 16px 20px; }
        .filter-chip { padding: 8px 16px; background: var(--bg-secondary); border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; border: 1px solid var(--border-light); color: var(--text-tertiary); }
        .filter-chip.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }

        .chart-card { background: var(--bg-secondary); border-radius: 16px; padding: 16px; margin: 0 16px 16px; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); }

        .data-card { background: var(--bg-secondary); border-radius: 16px; padding: 16px; text-align: center; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">健康趋势</div>
        </div>

        <div class="content">
            <div class="filter-bar animate-fadeIn">
                <div class="filter-chip active">健康评分</div>
                <div class="filter-chip">食欲</div>
                <div class="filter-chip">运动量</div>
            </div>

            <div class="chart-card animate-fadeIn delay-1">
                <div class="flex items-center justify-between mb-4">
                    <span class="font-semibold" style="color: var(--text-primary);">健康评分趋势</span>
                    <span class="text-sm" style="color: var(--text-tertiary);">近30天</span>
                </div>
                <div class="h-48 flex items-end justify-between gap-2">
                    <div class="flex-1 bg-gradient-to-t from-[#A8E6CF] to-[#7ACF7A] rounded-t-lg" style="height: 85%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#A8E6CF] to-[#7ACF7A] rounded-t-lg" style="height: 88%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#A8E6CF] to-[#7ACF7A] rounded-t-lg" style="height: 90%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#A8E6CF] to-[#7ACF7A] rounded-t-lg" style="height: 87%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#A8E6CF] to-[#7ACF7A] rounded-t-lg" style="height: 92%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#A8E6CF] to-[#7ACF7A] rounded-t-lg" style="height: 95%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#A8E6CF] to-[#7ACF7A] rounded-t-lg" style="height: 92%"></div>
                </div>
                <div class="flex justify-between mt-2 text-xs" style="color: var(--text-tertiary);">
                    <span>1日</span>
                    <span>7日</span>
                    <span>14日</span>
                    <span>21日</span>
                    <span>28日</span>
                </div>
            </div>

            <div class="px-4 animate-fadeIn delay-1">
                <div class="flex gap-3 mb-4">
                    <div class="data-card">
                        <div class="text-2xl font-bold" style="color: var(--text-primary);" id="currentScore">92</div>
                        <div class="text-xs" style="color: var(--text-tertiary);">健康评分</div>
                        <div class="text-xs mt-1" style="color: #5CB85C;" id="scoreChange">↑ 2</div>
                    </div>
                    <div class="data-card">
                        <div class="text-2xl font-bold" style="color: var(--text-primary);">优秀</div>
                        <div class="text-xs" style="color: var(--text-tertiary);">食欲状态</div>
                        <div class="text-xs mt-1" style="color: #5CB85C;">稳定</div>
                    </div>
                    <div class="data-card">
                        <div class="text-2xl font-bold" style="color: var(--text-primary);">良好</div>
                        <div class="text-xs" style="color: var(--text-tertiary);">运动状态</div>
                        <div class="text-xs mt-1" style="color: #5CB85C;">稳定</div>
                    </div>
                </div>
            </div>

            <div class="chart-card animate-fadeIn delay-2">
                <div class="flex items-center justify-between mb-4">
                    <span class="font-semibold" style="color: var(--text-primary);">活动量趋势</span>
                    <span class="text-sm" style="color: var(--text-tertiary);">近30天</span>
                </div>
                <div class="h-32 flex items-end justify-between gap-2">
                    <div class="flex-1 bg-gradient-to-t from-[#9B9B9B] to-[#CFCFCF] rounded-t-lg" style="height: 60%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#9B9B9B] to-[#CFCFCF] rounded-t-lg" style="height: 65%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#9B9B9B] to-[#CFCFCF] rounded-t-lg" style="height: 70%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#9B9B9B] to-[#CFCFCF] rounded-t-lg" style="height: 68%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#9B9B9B] to-[#CFCFCF] rounded-t-lg" style="height: 75%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#9B9B9B] to-[#CFCFCF] rounded-t-lg" style="height: 72%"></div>
                    <div class="flex-1 bg-gradient-to-t from-[#9B9B9B] to-[#CFCFCF] rounded-t-lg" style="height: 80%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPet = 'tuanzi';

        const healthData = {
            doudou: { score: '90', change: '+1' },
            tuanzi: { score: '95', change: '+2' },
            xiaomi: { score: '98', change: '+1' }
        };

        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return params.get('pet') || 'tuanzi';
        }

        function initPage() {
            currentPet = getURLParams();
            updateHealthDisplay();
        }

        function updateHealthDisplay() {
            const data = healthData[currentPet] || healthData.tuanzi;
            document.getElementById('currentScore').textContent = data.score;
            document.getElementById('scoreChange').textContent = '↑ ' + data.change;
        }

        function goBack() { window.history.back(); }

        window.onload = initPage;
    </script>
</body>
</html>
