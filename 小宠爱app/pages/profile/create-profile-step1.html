<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新建档案 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=PingFang+SC:wght@400;500;600;700&display=swap');
        * { font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }

        .content { height: calc(100% - 44px - 52px - 80px); overflow-y: auto; background: var(--bg-primary); }
        .content::-webkit-scrollbar { display: none; }

        .step-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; }
        .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-light); transition: all 0.25s ease; }
        .step-dot.active { width: 24px; border-radius: 4px; background: var(--text-primary); }
        .step-dot.completed { background: var(--text-primary); }

        .pet-type-card { background: var(--bg-secondary); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: all 0.25s ease; cursor: pointer; border: 1px solid var(--border-light); box-shadow: var(--shadow-soft); }
        .pet-type-card:hover { box-shadow: var(--shadow-medium); transform: translateY(-2px); }
        .pet-type-card.selected { border-color: var(--text-primary); background: var(--bg-tertiary); }

        .btn-primary { background: var(--text-primary); color: #fff; border: none; border-radius: 24px; padding: 14px 32px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; width: 100%; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .bottom-bar { padding: 16px 20px; background: var(--bg-secondary); border-top: 1px solid var(--border-light); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">新建档案</div>
        </div>

        <div class="step-indicator">
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
        </div>

        <div class="content">
            <div class="p-5">
                <h2 class="text-lg font-semibold mb-2 text-center" style="color: var(--text-primary);">选择宠物类型</h2>
                <p class="text-sm mb-6 text-center" style="color: var(--text-tertiary);">请选择您要添加的宠物类型</p>

                <div class="grid grid-cols-2 gap-4">
                    <div class="pet-type-card animate-fadeIn" onclick="selectPetType('dog')">
                        <div class="w-16 h-16 rounded-full flex items-center justify-center mb-3" style="background: var(--bg-tertiary);">
                            <i class="fas fa-dog text-3xl" style="color: var(--text-secondary);"></i>
                        </div>
                        <span class="font-semibold" style="color: var(--text-primary);">狗狗</span>
                    </div>

                    <div class="pet-type-card animate-fadeIn delay-1" onclick="selectPetType('cat')">
                        <div class="w-16 h-16 rounded-full flex items-center justify-center mb-3" style="background: var(--bg-tertiary);">
                            <i class="fas fa-cat text-3xl" style="color: var(--text-secondary);"></i>
                        </div>
                        <span class="font-semibold" style="color: var(--text-primary);">猫咪</span>
                    </div>

                    <div class="pet-type-card animate-fadeIn delay-2" onclick="selectPetType('rabbit')">
                        <div class="w-16 h-16 rounded-full flex items-center justify-center mb-3" style="background: var(--bg-tertiary);">
                            <i class="fas fa-carrot text-3xl" style="color: var(--text-secondary);"></i>
                        </div>
                        <span class="font-semibold" style="color: var(--text-primary);">兔子</span>
                    </div>

                    <div class="pet-type-card animate-fadeIn delay-3" onclick="selectPetType('other')">
                        <div class="w-16 h-16 rounded-full flex items-center justify-center mb-3" style="background: var(--bg-tertiary);">
                            <i class="fas fa-paw text-3xl" style="color: var(--text-secondary);"></i>
                        </div>
                        <span class="font-semibold" style="color: var(--text-primary);">其他</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn-primary" onclick="goToStep2()" disabled id="nextBtn">下一步</button>
        </div>
    </div>

    <script>
        let selectedType = null;

        function goBack() { window.history.back(); }
        function goToStep2() { window.location.href = 'create-profile-step2.html'; }

        function selectPetType(type) {
            selectedType = type;
            document.querySelectorAll('.pet-type-card').forEach(card => card.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }
    </script>
</body>
</html>
