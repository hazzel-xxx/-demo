<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物档案 - 小宠爱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box; }

        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F5F5;
            --text-primary: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9B9B9B;
            --border-light: #EBEBEB;
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-medium: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-layer: 0 8px 24px rgba(0,0,0,0.08);
        }

        body { background: #E5E5E5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame { width: 393px; height: 852px; background: var(--bg-primary); border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px -15px rgba(0,0,0,0.15); position: relative; }

        .status-bar { height: 44px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-light); }
        .status-bar .time { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-bar .icons { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

        .nav-bar { height: 52px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border-light); position: relative; }
        .nav-bar .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .nav-bar .title { font-size: 16px; font-weight: 600; color: var(--text-primary); position: absolute; left: 50%; transform: translateX(-50%); }
        .nav-bar .right-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; color: var(--text-tertiary); font-size: 14px; cursor: pointer; }

        .content { height: calc(100% - 44px - 52px - 72px); overflow-y: auto; background: var(--bg-primary); }
        .content::-webkit-scrollbar { display: none; }

        .tab-bar { height: 72px; background: var(--bg-secondary); border-top: 1px solid var(--border-light); display: flex; position: absolute; bottom: 0; left: 0; right: 0; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-tertiary); font-size: 10px; cursor: pointer; transition: all 0.2s ease; }
        .tab-item.active { color: var(--text-primary); }
        .tab-item i { font-size: 20px; }

        .pet-card { background: var(--bg-secondary); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; transition: all 0.25s ease; cursor: pointer; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); margin-bottom: 12px; }
        .pet-card:hover { box-shadow: var(--shadow-medium); transform: translateY(-2px); }

        .add-btn { width: 52px; height: 52px; background: var(--text-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-medium); cursor: pointer; transition: all 0.25s ease; }
        .add-btn:hover { transform: scale(1.05); }
        .add-btn:active { transform: scale(0.95); }
        .add-btn i { color: #fff; font-size: 18px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="back-btn" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="title">宠物档案</div>
            <div class="right-btn"></div>
        </div>

        <div class="content">
            <div class="p-5">
                <div class="space-y-3 animate-fadeIn">
                    <div class="pet-card" onclick="goToProfileDetail()">
                        <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=100&h=100&fit=crop" class="w-14 h-14 rounded-full object-cover">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-medium text-[#2C2C2C]">豆豆</span>
                                <span class="px-2 py-0.5 bg-[#F5F5F5] rounded-full text-xs text-[#6B6B6B]">金毛</span>
                            </div>
                            <div class="text-xs text-[#9B9B9B]">5岁 · 雄性 · 已绝育</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color: #C4C4C4; font-size: 12px;"></i>
                    </div>

                    <div class="pet-card" onclick="goToProfileDetailTuanzi()">
                        <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=100&h=100&fit=crop" class="w-14 h-14 rounded-full object-cover">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-medium text-[#2C2C2C]">团子</span>
                                <span class="px-2 py-0.5 bg-[#F5F5F5] rounded-full text-xs text-[#6B6B6B]">中国田园猫</span>
                            </div>
                            <div class="text-xs text-[#9B9B9B]">3岁 · 雌性</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color: #C4C4C4; font-size: 12px;"></i>
                    </div>

                    <div class="pet-card" onclick="goToProfileDetailXiaomi()">
                        <img src="https://images.unsplash.com/photo-1548247416-ec66f4900b2e?w=100&h=100&fit=crop" class="w-14 h-14 rounded-full object-cover">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-medium text-[#2C2C2C]">小咪</span>
                                <span class="px-2 py-0.5 bg-[#F5F5F5] rounded-full text-xs text-[#6B6B6B]">英国短毛猫</span>
                            </div>
                            <div class="text-xs text-[#9B9B9B]">2岁 · 雄性</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color: #C4C4C4; font-size: 12px;"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-bar">
            <div class="tab-item" onclick="goToHome()">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="tab-item active" onclick="goToProfiles()">
                <i class="fas fa-folder-open"></i>
                <span>档案</span>
            </div>
            <div class="tab-item" onclick="goToRecords()">
                <i class="fas fa-clipboard-list"></i>
                <span>日常</span>
            </div>
            <div class="tab-item" onclick="goToHealth()">
                <i class="fas fa-heartbeat"></i>
                <span>健康</span>
            </div>
            <div class="tab-item" onclick="goToMy()">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>

    <script>
        function goBack() { window.history.back(); }
        function goToHome() { window.location.href = '../../home.html'; }
        function goToProfiles() { location.reload(); }
        function goToRecords() { window.location.href = '../records/records-home.html'; }
        function goToHealth() { window.location.href = '../health/health-reminders.html'; }
        function goToMy() { window.location.href = '../my/my-home.html'; }
        function goToProfileDetail() { window.location.href = 'profile-detail.html'; }
        function goToProfileDetailTuanzi() { window.location.href = 'profile-detail-tuanzi.html'; }
        function goToProfileDetailXiaomi() { window.location.href = 'profile-detail-xiaomi.html'; }
    </script>
</body>
</html>
